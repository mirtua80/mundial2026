// ── PUNTUACIÓN ────────────────────────────────────────────────────────────
function calcPoints(pred, real, joker=false) {
  if (!pred||!real) return {pts:0,bonus:0,scorer:0,total:0,error:null};
  const ph=parseInt(pred.home),pa=parseInt(pred.away),rh=parseInt(real.home),ra=parseInt(real.away);
  if ([ph,pa,rh,ra].some(isNaN)) return {pts:0,bonus:0,scorer:0,total:0,error:null};
  const error=Math.abs(ph-rh)+Math.abs(pa-ra);
  let pts=error===0?10:error===1?6:error===2?3:error===3?1:0;
  const bonus=(ph>pa?"H":ph<pa?"A":"D")===(rh>ra?"H":rh<ra?"A":"D")?2:0;
  const scorerBonus = (pred.scorer && real.scorer && pred.scorer===real.scorer) ? 3 : 0;
  if (joker) pts = pts * 2;
  return {pts,bonus,scorer:scorerBonus,total:pts+bonus+scorerBonus,error};
}
function mkBadge(r) {
  if (r.error===null) return null;
  if (r.error===0) return {label:`🎯 ${r.total} pts`,color:"#16a34a"};
  if (r.total>0)   return {label:`${r.pts}+${r.bonus}${r.scorer?"+"+r.scorer:""} pts`,color:r.pts>=6?"#d97706":"#64748b"};
  return {label:r.bonus>0||r.scorer>0?`+${r.bonus+r.scorer} pts`:"❌ 0",color:"#7c3aed"};
}

// ── FIREBASE HOOK ─────────────────────────────────────────────────────────
function useFB(path, def) {
  const [data,setData]=useState(def);
  useEffect(()=>{
    if (!window._fb) return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,path),snap=>{ const v=snap.val(); setData(v!==null?v:def); });
    return ()=>unsub();
  },[path]);
  const save=async(d)=>{ const {db,ref,set}=window._fb; await set(ref(db,path),d); };
  return [data,save];
}

// ── NOTIFICACIONES ────────────────────────────────────────────────────────
function requestNotifPerm() {
  if ("Notification" in window && Notification.permission==="default") Notification.requestPermission();
}
function scheduleNotifs(preds, user) {
  if (!("Notification" in window) || Notification.permission!=="granted") return;
  const now = Date.now();
  MATCHES.forEach(m => {
    const matchDate = new Date(`2026 ${m.date} 18:00`).getTime();
    const oneHourBefore = matchDate - 60*60*1000;
    if (oneHourBefore > now && !preds[user]?.[m.id]) {
      const delay = oneHourBefore - now;
      if (delay < 24*60*60*1000) { // solo si es en menos de 24h
        setTimeout(() => {
          new Notification("⚽ ¡Falta 1 hora!", {
            body: `${m.home} vs ${m.away} — aún no has predicho`,
            icon: "/favicon.ico"
          });
        }, delay);
      }
    }
  });
}

              <select style={{...S.inp,marginBottom:0,padding:"6px 10px",fontSize:12,background:"#0f172a"}}
                value={sc} onChange={e=>setScorerInp(p=>({...p,[m.id]:e.target.value}))}>
                <option value="">— Seleccionar jugador —</option>
                {PLAYERS.filter(p=>p.country===m.home||p.country===m.away).map(p=>(
                  <option key={p.name} value={p.name}>{p.flag} {p.name} ({p.country})</option>
                ))}
              </select>
            </div>}
            {done&&real.scorer&&<div style={{marginTop:4,fontSize:11,color:"#64748b"}}>⚽ Goleador: <b style={{color:"#22c55e"}}>{real.scorer}</b>{pred?.scorer&&<span style={{marginLeft:6}}>Tu pred: <b style={{color:pred.scorer===real.scorer?"#22c55e":"#ef4444"}}>{pred.scorer}</b></span>}</div>}

            {done&&pred&&(
              <div style={{marginTop:6,background:"#0f172a",borderRadius:8,padding:"6px 10px",fontSize:11,display:"flex",gap:10,flexWrap:"wrap"}}>
                <span><span style={{color:"#64748b"}}>Pred: </span><b>{pred.home}–{pred.away}</b></span>
                <span><span style={{color:"#64748b"}}>Error: </span>{r.error}g</span>
                <span><span style={{color:"#64748b"}}>Base: </span><b style={{color:"#f59e0b"}}>{r.pts}{hasJoker?" (x2)":""}</b></span>
                <span><span style={{color:"#64748b"}}>+Bonus: </span><b style={{color:"#7c3aed"}}>{r.bonus+r.scorer}</b></span>
              </div>
            )}

            {!done&&(
              <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                <button style={{flex:1,...btnStyle("#0f3460","#1d4ed8","#93c5fd")}} onClick={()=>onSave(m.id,hv,av,sc)}>Guardar ✓</button>
                {!myJoker&&!hasJoker&&<button style={{padding:"7px 10px",...btnStyle("#2e1065","#7c3aed","#d8b4fe")}} onClick={()=>onUseJoker(m.id)}>🃏 x2</button>}
                {hasJoker&&<button style={{padding:"7px 10px",...btnStyle("#1a0a0a","#7f1d1d","#fca5a5")}} onClick={onRemoveJoker}>✕ x2</button>}
                {pred&&<button style={{padding:"7px 10px",...btnStyle("#1a0a0a","#7f1d1d","#fca5a5")}} onClick={()=>onDeletePred(m.id)}>🗑️</button>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function btnStyle(bg,border,color){ return {background:bg,border:`1px solid ${border}`,borderRadius:8,color,fontSize:12,cursor:"pointer",padding:"7px"}; }

// ── DREAM XI ──────────────────────────────────────────────────────────────
function DreamXITab({user,dreamXI,onSave,onReset}) {
  const [selected,setSelected]=useState(dreamXI[user]||[]);
  const [search,setSearch]=useState(""); const [posF,setPosF]=useState("ALL"); const [ctryF,setCtryF]=useState("ALL");
  useEffect(()=>setSelected(dreamXI[user]||[]),[user,JSON.stringify(dreamXI[user])]);
  const topCount=selected.filter(p=>TOP30.has(p.name)).length;
  const toggle=(p)=>{
    if(selected.find(s=>s.name===p.name)){setSelected(selected.filter(s=>s.name!==p.name));return;}
    if(selected.length>=11||(TOP30.has(p.name)&&topCount>=3))return;
    setSelected([...selected,p]);
  };
  const countries=["ALL",...new Set(PLAYERS.map(p=>p.country))].sort((a,b)=>a==="ALL"?-1:a.localeCompare(b));
  const filtered=PLAYERS.filter(p=>{
    const ms=search===""||p.name.toLowerCase().includes(search.toLowerCase())||p.country.toLowerCase().includes(search.toLowerCase());
    return ms&&(posF==="ALL"||p.pos===posF)&&(ctryF==="ALL"||p.country===ctryF);
  });
  const posLayout={POR:[0],DEF:[1,2,3,4],MED:[5,6,7],DEL:[8,9,10]};
  const slotLbl=["POR","LT","DFC","DFC","RT","MCD","MC","MC","EXT","DC","EXT"];

  return (
    <div>
      <div style={{background:"linear-gradient(135deg,#14532d,#166534)",borderRadius:12,padding:"12px 16px",marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontWeight:"bold",fontSize:15,color:"#86efac"}}>⭐ Dream XI — {selected.length}/11</div>
          <div style={{fontSize:12,color:"#4ade80",marginTop:2}}>TOP30 usados: {topCount}/3</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          {selected.length===11&&<button style={{...S.btn,width:"auto",padding:"8px 12px",fontSize:12}} onClick={()=>onSave(selected)}>Guardar 🌟</button>}
          {selected.length>0&&<button style={{padding:"8px 10px",borderRadius:10,...btnStyle("#1a0a0a","#7f1d1d","#fca5a5")}} onClick={()=>{setSelected([]);onReset();}}>🗑️</button>}
        </div>
      </div>
      {selected.length>0&&(
        <div style={{background:"#14532d",borderRadius:12,padding:12,marginBottom:12,border:"1px solid #166534"}}>
          <div style={{fontSize:11,color:"#86efac",textAlign:"center",marginBottom:8}}>Toca para quitar</div>
          {Object.entries(posLayout).map(([pos,idxs])=>(
            <div key={pos} style={{display:"flex",justifyContent:"center",gap:6,marginBottom:8}}>
              {idxs.map(i=>{
                const p=selected[i];
                return p?(
                  <div key={i} onClick={()=>toggle(p)} style={{background:"rgba(255,255,255,0.13)",borderRadius:8,padding:"6px 7px",textAlign:"center",minWidth:54,cursor:"pointer",border:TOP30.has(p.name)?"1px solid #fbbf24":"1px solid transparent"}}>
                    <div style={{fontSize:16}}>{p.flag}</div>
                    <div style={{fontSize:9,color:"#fff",fontWeight:"bold",maxWidth:52,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name.split(" ").slice(-1)[0]}</div>
                    <div style={{fontSize:8,color:"#86efac"}}>{slotLbl[i]}</div>
                    {TOP30.has(p.name)&&<div style={{fontSize:8,color:"#fbbf24"}}>★</div>}
                  </div>
                ):(
                  <div key={i} style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"6px 7px",textAlign:"center",minWidth:54,border:"1px dashed #166534"}}>
                    <div style={{fontSize:16,color:"rgba(74,222,128,0.2)"}}>?</div>
                    <div style={{fontSize:8,color:"#4ade80"}}>{slotLbl[i]}</div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
      {topCount>=3&&<div style={{background:"#7c2d12",border:"1px solid #ea580c",borderRadius:8,padding:"7px 12px",fontSize:12,color:"#fed7aa",marginBottom:8}}>⚠️ Límite TOP30 alcanzado.</div>}
      {selected.length>=11&&<div style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:8,padding:"7px 12px",fontSize:12,color:"#93c5fd",marginBottom:8}}>✅ XI completo. Pulsa Guardar.</div>}
      <input style={{...S.inp,marginBottom:8,padding:"8px 12px",fontSize:12}} placeholder="🔍 Buscar..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>
        {["ALL","POR","DEF","MED","DEL"].map(p=>(
          <button key={p} onClick={()=>setPosF(p)} style={{padding:"4px 9px",borderRadius:20,cursor:"pointer",border:`1px solid ${posF===p?"#f59e0b":"#334155"}`,background:posF===p?"rgba(245,158,11,0.13)":"#1e293b",color:posF===p?"#f59e0b":"#94a3b8",fontSize:11}}>
            {p==="ALL"?"Todos":POS_LABEL[p]}
          </button>
        ))}
      </div>
      <select style={{...S.inp,marginBottom:10,padding:"8px 12px",fontSize:12}} value={ctryF} onChange={e=>setCtryF(e.target.value)}>
        {countries.map(c=><option key={c} value={c}>{c==="ALL"?"🌍 Todos":c}</option>)}
      </select>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
        {filtered.map(p=>{
          const sel=!!selected.find(s=>s.name===p.name);
          const isStar=TOP30.has(p.name);
          const blocked=!sel&&(selected.length>=11||(isStar&&topCount>=3));
          return (
            <button key={p.name} onClick={()=>!blocked&&toggle(p)} style={{display:"flex",alignItems:"center",gap:7,padding:"8px 9px",textAlign:"left",background:sel?"#0f3460":blocked?"#111827":"#1e293b",border:`1px solid ${sel?"#f59e0b":isStar?"#a855f7":"#334155"}`,borderRadius:10,cursor:blocked?"not-allowed":"pointer",opacity:blocked?0.4:1}}>
              <span style={{fontSize:18}}>{p.flag}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:11,color:sel?"#fbbf24":isStar?"#d8b4fe":"#f1f5f9",fontWeight:isStar?"bold":"normal",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}{isStar?" ★":""}</div>
                <div style={{fontSize:9,color:"#64748b"}}>{p.country}</div>
              </div>
              <span style={{fontSize:9,fontWeight:"bold",padding:"2px 4px",borderRadius:4,background:POS_COLOR[p.pos]+"33",color:POS_COLOR[p.pos]}}>{p.pos}</span>
              {sel&&<span style={{color:"#22c55e",fontSize:13}}>✓</span>}
            </button>
          );
        })}
      </div>
      {Object.entries(dreamXI).filter(([n])=>n!==user).length>0&&(
        <div style={{marginTop:14}}>
          <div style={{fontWeight:"bold",fontSize:13,marginBottom:8}}>Los XI de los demás 👀</div>
          {Object.entries(dreamXI).filter(([n])=>n!==user).map(([name,xi])=>(
            <div key={name} style={{background:"#1e293b",borderRadius:8,padding:"9px 12px",marginBottom:5,border:"1px solid #334155"}}>
              <div style={{fontWeight:"bold",fontSize:12,marginBottom:5}}>{name}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                {(xi||[]).map(p=>(
                  <span key={p.name||p} style={{fontSize:10,background:"#0f172a",borderRadius:12,padding:"2px 7px",color:TOP30.has(p.name||p)?"#fbbf24":"#94a3b8",border:`1px solid ${TOP30.has(p.name||p)?"rgba(245,158,11,0.27)":"#334155"}`}}>
                    {p.flag||""} {p.name||p}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── RANKING ───────────────────────────────────────────────────────────────
function RankingTab({leaderboard,preds,results,jokers}) {
  const [exp,setExp]=useState(null);
  return (
    <div>
      <div style={{fontWeight:"bold",fontSize:15,marginBottom:12}}>🏆 Clasificación</div>
      {leaderboard.length===0&&<p style={{textAlign:"center",color:"#64748b",marginTop:40}}>Aún no hay participantes</p>}

        <div key={l.name}>
          <div onClick={()=>setExp(exp===l.name?null:l.name)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:"#1e293b",cursor:"pointer",borderRadius:exp===l.name?"10px 10px 0 0":10,marginBottom:exp===l.name?0:7,borderLeft:`4px solid ${i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#b45309":"#334155"}`}}>
            <div style={{fontSize:20,width:26}}>{"🥇🥈🥉"[i]||i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:14}}>{l.name}</div>
              <div style={{fontSize:10,color:"#64748b"}}>{l.matchPts}p · {l.dreamBonus}XI · {l.champBonus}camp</div>
            </div>
            <div style={{fontSize:20,fontWeight:"bold",color:"#f59e0b"}}>{l.total}<span style={{fontSize:10}}> pts</span></div>
            <span style={{color:"#475569",fontSize:11}}>{exp===l.name?"▲":"▼"}</span>
          </div>
          {exp===l.name&&(
            <div style={{background:"#0f1e33",borderRadius:"0 0 10px 10px",padding:"10px 14px",marginBottom:7,border:"1px solid #1e3a5f",borderTop:"none"}}>
              {MATCHES.filter(m=>results[m.id]).map(m=>{
                const real=results[m.id], pred=preds[l.name]?.[m.id];
                const hasJoker=jokers?.[l.name]?.matchId===m.id;
                const r=calcPoints(pred,real,hasJoker);
                return (
                  <div key={m.id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:"1px solid #1e293b",fontSize:11}}>
                    <span style={{color:"#94a3b8",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.home} vs {m.away}</span>
                    <span style={{color:"#64748b"}}>{real.home}–{real.away}</span>
                    <span style={{color:"#475569"}}>{pred?`${pred.home}–${pred.away}`:"–"}</span>
                    {hasJoker&&<span style={{color:"#a855f7"}}>🃏</span>}
                    <span style={{fontWeight:"bold",minWidth:32,textAlign:"right",color:r.total>=10?"#22c55e":r.total>=6?"#f59e0b":r.total>0?"#94a3b8":"#475569"}}>{pred?`+${r.total}`:"–"}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

      </Sec>
      <Sec icon="🌟" title="Dream XI" color="#a855f7">
        <p style={rP}>Elige 11 jugadores de cualquier selección. <b style={{color:"#f1f5f9"}}>Máximo 3 TOP30</b> (marcados con ★). Por cada TOP30 en tu XI → <b style={{color:"#f59e0b"}}>+1 punto por jornada</b>.</p>
      </Sec>
      <Sec icon="📊" title="Gráfica de evolución" color="#22c55e">
        <p style={rP}>Sigue la evolución de todos los participantes partido a partido en la pestaña Gráfica. ¡El drama de ver quién remonta es real!</p>
      </Sec>
      <Sec icon="🏆" title="Desempate" color="#64748b">
        <p style={rP}>En caso de empate en puntos totales, gana quien más resultados exactos (10 pts) haya acertado.</p>
      </Sec>
    </div>
  );
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
function AdminTab({results,preds,dreamXI,players,champion,realChamp,jokers,adminMode,adminPass,setAdminPass,onUnlock,onSave,onDeleteResult,onSetRealChamp,onResetUserPreds,onResetUserDream,onRemoveUser}) {
  const [inp,setInp]=useState({}); const [scorerInp,setScorerInp]=useState({});
  const [sec,setSec]=useState("res"); const [confirm,setConfirm]=useState(null);
  const setV=(id,side,val)=>setInp(p=>({...p,[id]:{...(p[id]||{}),[side]:val}}));

  if (!adminMode) return (
    <div>
      <div style={{fontWeight:"bold",fontSize:15,marginBottom:12}}>🔒 Panel Admin</div>
      <input style={S.inp} type="password" placeholder="Contraseña..." value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onUnlock()}/>
      <button style={S.btn} onClick={onUnlock}>Entrar</button>
      <p style={{textAlign:"center",fontSize:12,color:"#475569",marginTop:10}}>Contraseña: mundial2026</p>
    </div>
  );

  const Confirm=({msg,onYes,onNo})=>(
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.75)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#1e293b",borderRadius:14,padding:24,maxWidth:300,width:"100%",textAlign:"center",border:"1px solid #ef4444"}}>
        <div style={{fontSize:28,marginBottom:10}}>⚠️</div>
        <div style={{fontSize:13,color:"#f1f5f9",marginBottom:20}}>{msg}</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onNo} style={{flex:1,padding:"9px",borderRadius:8,background:"#334155",border:"none",color:"#f1f5f9",cursor:"pointer",fontSize:12}}>Cancelar</button>
          <button onClick={onYes} style={{flex:1,padding:"9px",borderRadius:8,background:"#dc2626",border:"none",color:"#fff",fontWeight:"bold",cursor:"pointer",fontSize:12}}>Confirmar</button>
        </div>
      </div>
    </div>
  );

  return (
    <div>
      {confirm&&<Confirm msg={confirm.msg} onYes={()=>{confirm.action();setConfirm(null);}} onNo={()=>setConfirm(null)}/>}
      <div style={{fontWeight:"bold",fontSize:15,marginBottom:12}}>⚙️ Panel Admin</div>
      <div style={{display:"flex",gap:5,marginBottom:14,background:"#1e293b",borderRadius:10,padding:4}}>
        {[["res","⚽ Resultados"],["camp","🏆 Campeón"],["usr","👥 Usuarios"]].map(([k,l])=>(
          <button key={k} onClick={()=>setSec(k)} style={{flex:1,padding:"7px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:"bold",background:sec===k?"#f59e0b":"transparent",color:sec===k?"#0f172a":"#64748b"}}>{l}</button>
        ))}
      </div>

      {sec==="res"&&<div>
        <p style={{fontSize:12,color:"#64748b",marginBottom:10}}>Introduce el marcador final. El goleador es opcional (+3 pts si alguien lo acertó).</p>
        {MATCHES.map(m=>{
          const hv=inp[m.id]?.home??results[m.id]?.home??"";
          const av=inp[m.id]?.away??results[m.id]?.away??"";
          const sv=scorerInp[m.id]??results[m.id]?.scorer??"";
          return (
            <div key={m.id} style={{background:"#1e293b",borderRadius:10,padding:12,marginBottom:7,border:"1px solid #334155"}}>
              <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}>
                <span style={{background:"#f59e0b",color:"#0f172a",fontSize:10,fontWeight:"bold",padding:"2px 6px",borderRadius:5}}>Gr.{m.group}</span>
                <span style={{fontSize:11,color:"#64748b"}}>{m.date}</span>
                {results[m.id]&&<span style={{fontSize:10,color:"#22c55e",marginLeft:"auto"}}>✓ {results[m.id].home}–{results[m.id].away}{results[m.id].scorer?" ⚽"+results[m.id].scorer:""}</span>}
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                <span style={{flex:1,fontSize:12}}>{m.home}</span>
                <input style={S.scoreBox} type="number" min="0" max="20" value={hv} onChange={e=>setV(m.id,"home",e.target.value)}/>
                <span style={{color:"#f59e0b",fontWeight:"bold"}}>:</span>
                <input style={S.scoreBox} type="number" min="0" max="20" value={av} onChange={e=>setV(m.id,"away",e.target.value)}/>
                <span style={{flex:1,fontSize:12,textAlign:"right"}}>{m.away}</span>
              </div>
              <select style={{...S.inp,marginBottom:6,padding:"5px 8px",fontSize:11,background:"#0f172a"}}
                value={sv} onChange={e=>setScorerInp(p=>({...p,[m.id]:e.target.value}))}>
                <option value="">— Primer goleador (opcional) —</option>
                {PLAYERS.filter(p=>p.country===m.home||p.country===m.away).map(p=>(
                  <option key={p.name} value={p.name}>{p.flag} {p.name}</option>
                ))}
              </select>
              <div style={{display:"flex",gap:6}}>
                <button style={{flex:1,padding:"6px",...btnStyle("rgba(29,78,216,0.13)","#3b82f6","#93c5fd")}} onClick={()=>onSave(m.id,hv,av,sv)}>Guardar ✓</button>
                {results[m.id]&&<button style={{padding:"6px 9px",...btnStyle("#1a0a0a","#7f1d1d","#fca5a5")}} onClick={()=>setConfirm({msg:`¿Borrar resultado de ${m.home} vs ${m.away}?`,action:()=>onDeleteResult(m.id)})}>🗑️</button>}
              </div>
            </div>
          );
        })}
      </div>}

      {sec==="camp"&&<div>
        <p style={{fontSize:12,color:"#64748b",marginBottom:12}}>Confirma el campeón real al final del torneo para repartir los 50 pts bonus.</p>
        {realChamp&&<div style={{background:"#1e293b",borderRadius:10,padding:"12px 14px",marginBottom:12,border:"1px solid #16a34a",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:24}}>{TEAMS.find(t=>t.name===realChamp)?.flag||"🏆"}</span>
          <div style={{flex:1}}><div style={{fontSize:11,color:"#64748b"}}>Campeón confirmado</div><div style={{fontWeight:"bold",color:"#22c55e"}}>{realChamp}</div></div>
          <button style={{padding:"5px 9px",...btnStyle("#1a0a0a","#7f1d1d","#fca5a5"),fontSize:11}} onClick={()=>onSetRealChamp(null)}>Cambiar</button>
        </div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
          {TEAMS.map(t=>(
            <button key={t.name} onClick={()=>setConfirm({msg:`¿Confirmar a ${t.name} como campeón del Mundial 2026?`,action:()=>onSetRealChamp(t.name)})} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 10px",background:realChamp===t.name?"#0f3460":"#1e293b",border:`1px solid ${realChamp===t.name?"#22c55e":"#334155"}`,borderRadius:10,cursor:"pointer",textAlign:"left"}}>
              <span style={{fontSize:20}}>{t.flag}</span>
              <span style={{fontSize:12,color:realChamp===t.name?"#22c55e":"#f1f5f9",flex:1}}>{t.name}</span>
              {realChamp===t.name&&<span style={{color:"#22c55e"}}>✓</span>}
            </button>
          ))}
        </div>
      </div>}

      {sec==="usr"&&<div>
        {Object.keys(players).length===0&&<p style={{textAlign:"center",color:"#64748b"}}>No hay participantes</p>}
        {Object.keys(players).map(name=>(
          <div key={name} style={{background:"#1e293b",borderRadius:12,padding:14,marginBottom:8,border:"1px solid #334155"}}>
            <div style={{display:"flex",alignItems:"center",marginBottom:10}}>
              <div style={{flex:1,fontWeight:"bold",fontSize:14}}>{name}</div>
              <span style={{fontSize:10,color:"#64748b"}}>{Object.keys(preds[name]||{}).length} preds · {(dreamXI[name]||[]).length} XI · {champion[name]||"sin apuesta"}</span>
            </div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
              {[["🗑️ Predicciones","rgba(245,158,11,0.1)","#f59e0b44","#fbbf24",()=>onResetUserPreds(name)],
                ["🗑️ Dream XI","rgba(168,85,247,0.1)","#a855f744","#d8b4fe",()=>onResetUserDream(name)],
                ["❌ Eliminar","#1a0a0a","#7f1d1d","#fca5a5",()=>onRemoveUser(name)]].map(([l,bg,border,color,action])=>(
                <button key={l} style={{padding:"6px 9px",borderRadius:8,background:bg,border:`1px solid ${border}`,color,fontSize:11,cursor:"pointer"}}
                  onClick={()=>setConfirm({msg:`¿${l} de ${name}?`,action})}>
                  {l}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>}
    </div>
  );
}

const S={
  inp:{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid #475569",background:"#0f172a",color:"#f1f5f9",fontSize:15,marginBottom:10,fontFamily:"Georgia,serif",outline:"none"},
  btn:{width:"100%",padding:"11px",borderRadius:10,background:"linear-gradient(135deg,#f59e0b,#d97706)",border:"none",color:"#0f172a",fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"Georgia,serif"},
  scoreBox:{width:44,height:36,borderRadius:8,border:"1px solid #475569",background:"#0f172a",color:"#f1f5f9",textAlign:"center",fontSize:17,fontWeight:"bold",fontFamily:"Georgia,serif"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
