// ── PUNTUACIÓN ────────────────────────────────────────────────────────────
function calcPoints(pred, real) {
  if (!pred||!real) return {pts:0,bonus:0,total:0,error:null};
  const ph=parseInt(pred.home),pa=parseInt(pred.away),rh=parseInt(real.home),ra=parseInt(real.away);
  if ([ph,pa,rh,ra].some(isNaN)) return {pts:0,bonus:0,total:0,error:null};
  const error=Math.abs(ph-rh)+Math.abs(pa-ra);
  const pts=error===0?10:error===1?6:error===2?3:error===3?1:0;
  const bonus=(ph>pa?"H":ph<pa?"A":"D")===(rh>ra?"H":rh<ra?"A":"D")?2:0;
  return {pts,bonus,total:pts+bonus,error};
}
function mkBadge(r) {
  if (r.error===null) return null;
  if (r.error===0) return {label:`🎯 ${r.total} pts`,color:"#16a34a"};
  if (r.total>0)   return {label:`${r.pts}+${r.bonus} pts`,color:r.pts>=6?"#d97706":"#64748b"};
  return {label:r.bonus>0?`+${r.bonus} pts`:"❌ 0",color:r.bonus>0?"#7c3aed":"#475569"};
}

// ── FIREBASE HOOK ─────────────────────────────────────────────────────────
function useFB(path, def) {
  const [data,setData]=useState(def);
  useEffect(()=>{
    if (!window._fb) return;
    const {db,ref,onValue}=window._fb;
    const unsub=onValue(ref(db,path),snap=>{
      const v=snap.val(); setData(v!==null?v:def);
    });
    return ()=>unsub();
  },[path]);
  const save=async(d)=>{ const {db,ref,set}=window._fb; await set(ref(db,path),d); };
  return [data,save];
}

// ── API-FOOTBALL: obtener partidos del Mundial ────────────────────────────
async function fetchFixtures() {
  try {
    const res = await fetch(`${API_BASE}/fixtures?league=1&season=2026`, {
      headers:{"x-rapidapi-key":API_KEY,"x-rapidapi-host":"v3.football.api-sports.io"}
    });
    const data = await res.json();
    return data.response || [];
  } catch(e) { return []; }
}

// Convierte fixture de API al formato interno {id, home, away, group, date, status, homeScore, awayScore}
function parseFixture(f) {
  const home = f.teams?.home?.name || "";
  const away = f.teams?.away?.name || "";
  const status = f.fixture?.status?.short || "";
  const homeScore = f.goals?.home;
  const awayScore = f.goals?.away;
  const round = f.league?.round || "";
  const group = round.replace("Group Stage - ","").replace("Group ","").trim();
  const date = new Date(f.fixture?.date).toLocaleDateString("es-ES",{day:"2-digit",month:"short"});
  return { id: f.fixture?.id, home, away, group, date, status, homeScore, awayScore };
}

  const toast_=(msg,type="ok")=>{ setToast({msg,type}); setTimeout(()=>setToast(null),2800); };

  // Carga y refresco automático de partidos
  const loadFixtures = async () => {
    const raw = await fetchFixtures();
    if (raw.length > 0) {
      const parsed = raw.map(parseFixture);
      setFix(parsed);
      // Guarda resultados finalizados automáticamente en Firebase
      const finished = parsed.filter(f=>["FT","AET","PEN"].includes(f.status));
      if (finished.length > 0) {
        const {db,ref,set}=window._fb;
        const currentResults = {};
        finished.forEach(f=>{
          if (f.homeScore!=null && f.awayScore!=null) {
            currentResults[f.id]={home:String(f.homeScore),away:String(f.awayScore)};
          }
        });
        await set(ref(db,"results"),currentResults);
      }
    }
    setLF(false);
  };

  useEffect(()=>{
    loadFixtures();
    // Refresca cada 3 minutos
    const interval = setInterval(loadFixtures, 3*60*1000);
    return ()=>clearInterval(interval);
  },[]);

  // Refresca más rápido (30s) si hay partido en vivo
  useEffect(()=>{
    const live = fixtures.some(f=>["1H","HT","2H","ET","BT","P"].includes(f.status));
    if (!live) return;
    const fast = setInterval(loadFixtures, 30*1000);
    return ()=>clearInterval(fast);
  },[fixtures]);

  const join = async () => {
    if (!uname.trim()) return;
    const n=uname.trim();
    await savePlayers({...players,[n]:{joined:new Date().toISOString()}});
    localStorage.setItem("mundial26_user",n);
    setUser(n); toast_(`¡Bienvenido/a ${n}! ⚽`);
  };

  const leaderboard = Object.keys(players).map(name=>{
    let matchPts=0;
    Object.values(results).forEach((real,i)=>{
      const id=Object.keys(results)[i];
      matchPts+=calcPoints(preds[name]?.[id],real).total;
    });
    const xi=dreamXI[name]||[];
    const topCount=xi.filter(p=>TOP30.has(p.name)).length;
    const dreamBonus=topCount*Object.keys(results).length;
    return {name,matchPts,dreamBonus,total:matchPts+dreamBonus};
  }).sort((a,b)=>b.total-a.total);

  if (!user) return <Login name={uname} setName={setUname} onJoin={join} existing={Object.keys(players)}/>;

  return (
    <div style={{minHeight:"100vh",background:"#0f172a",color:"#f1f5f9",fontFamily:"Georgia,serif"}}>
      <style>{`@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}`}</style>
      {toast&&<div style={{position:"fixed",top:14,left:"50%",transform:"translateX(-50%)",zIndex:9999,
        padding:"9px 20px",borderRadius:8,color:"#fff",fontWeight:"bold",fontSize:14,
        boxShadow:"0 4px 20px rgba(0,0,0,0.4)",whiteSpace:"nowrap",animation:"fadein .2s ease",
        background:toast.type==="ok"?"#16a34a":"#dc2626"}}>{toast.msg}</div>}

      <header style={{background:"linear-gradient(135deg,#1e3a5f,#0f172a)",padding:"13px 16px",
        display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"2px solid #f59e0b"}}>
        <div style={{fontSize:17,fontWeight:"bold",color:"#f59e0b"}}>⚽ Mundial 2026</div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {!loadingFix&&fixtures.some(f=>["1H","HT","2H","ET","BT","P"].includes(f.status))&&
            <span style={{fontSize:11,background:"#ef4444",color:"#fff",borderRadius:20,padding:"2px 8px",fontWeight:"bold"}}>● LIVE</span>}
          <div style={{fontSize:12,color:"#94a3b8",cursor:"pointer"}}
            onClick={()=>{localStorage.removeItem("mundial26_user");setUser(null);}}>● {user} ✕</div>
        </div>
      </header>

      <nav style={{display:"flex",background:"#1e293b",borderBottom:"1px solid #334155"}}>
        {TABS.map((icon,i)=>(
          <button key={i} onClick={()=>setTab(i)} style={{flex:1,display:"flex",flexDirection:"column",
            alignItems:"center",justifyContent:"center",padding:"7px 2px",background:tab===i?"rgba(245,158,11,0.07)":"transparent",
            border:"none",color:tab===i?"#f59e0b":"#64748b",cursor:"pointer",
            borderBottom:tab===i?"2px solid #f59e0b":"2px solid transparent",gap:1}}>
            <span style={{fontSize:17}}>{icon}</span><span style={{fontSize:9}}>{TLBL[i]}</span>
          </button>
        ))}
      </nav>

      <main style={{padding:"14px 13px 80px",maxWidth:620,margin:"0 auto"}}>
        {tab===0&&<HomeTab leaderboard={leaderboard} user={user} results={results} preds={preds} onGoRules={()=>setTab(4)} fixtures={fixtures} loadingFix={loadingFix}/>}
        {tab===1&&<MatchesTab user={user} preds={preds} results={results} fixtures={fixtures} loadingFix={loadingFix}
          onSave={(id,h,a)=>{ savePreds({...preds,[user]:{...(preds[user]||{}),[id]:{home:h,away:a}}}); toast_("Predicción guardada ✅"); }}/>}
        {tab===2&&<DreamXITab user={user} dreamXI={dreamXI} onSave={xi=>{ saveDreamXI({...dreamXI,[user]:xi}); toast_("Dream XI guardado 🌟"); }}/>}
        {tab===3&&<RankingTab leaderboard={leaderboard} preds={preds} results={results}/>}
        {tab===4&&<RulesTab/>}
      </main>
    </div>
  );
}

// ── MATCHES ───────────────────────────────────────────────────────────────
function MatchesTab({user,preds,results,fixtures,loadingFix,onSave}) {
  const [inp,setInp]=useState({});
  const [groupFilter,setGF]=useState("ALL");
  const setV=(id,side,val)=>setInp(p=>({...p,[id]:{...(p[id]||{}),[side]:val}}));

  const displayFixtures = fixtures.length > 0
    ? fixtures.map(f=>({...f, home:normName(f.home), away:normName(f.away)}))
    : [];

  const filtered = groupFilter==="ALL" ? displayFixtures : displayFixtures.filter(f=>f.group===groupFilter);
  const groups = ["ALL",...new Set(displayFixtures.map(f=>f.group).filter(Boolean))].sort((a,b)=>a==="ALL"?-1:a.localeCompare(b));

  const isLive=(s)=>["1H","HT","2H","ET","BT","P"].includes(s);
  const isDone=(s)=>["FT","AET","PEN"].includes(s);

  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontWeight:"bold",fontSize:15}}>⚽ Partidos</div>
        {loadingFix&&<span style={{fontSize:12,color:"#64748b"}}>
          <span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⚽</span> Sincronizando…
        </span>}
      </div>

      {/* Filtro por grupo */}
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {groups.map(g=>(
          <button key={g} onClick={()=>setGF(g)} style={{padding:"4px 10px",borderRadius:20,cursor:"pointer",border:"none",
            background:groupFilter===g?"#f59e0b":"#1e293b",color:groupFilter===g?"#0f172a":"#94a3b8",fontSize:12,fontWeight:groupFilter===g?"bold":"normal"}}>
            {g==="ALL"?"Todos":`Gr. ${g}`}
          </button>
        ))}
      </div>

      {loadingFix&&filtered.length===0&&<div style={{textAlign:"center",padding:40,color:"#64748b"}}>Cargando partidos…</div>}

      {filtered.map(f=>{
        const pred=preds[user]?.[f.id];
        const real=results[f.id];
        const r=calcPoints(pred,real), b=mkBadge(r);
        const done=isDone(f.status), live=isLive(f.status);
        const hv=inp[f.id]?.home??pred?.home??"", av=inp[f.id]?.away??pred?.away??"";
        return (
          <div key={f.id} style={{background:"#1e293b",borderRadius:12,padding:12,marginBottom:8,
            border:`1px solid ${live?"#ef444466":"#334155"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
              <span style={{background:"#f59e0b",color:"#0f172a",fontSize:11,fontWeight:"bold",padding:"2px 7px",borderRadius:5}}>Gr. {f.group}</span>
              <span style={{fontSize:12,color:"#64748b"}}>{f.date}</span>
              {live&&<span style={{background:"#ef4444",color:"#fff",fontSize:11,fontWeight:"bold",padding:"2px 7px",borderRadius:5}}>● LIVE</span>}
              {b&&<span style={{marginLeft:"auto",fontSize:12,padding:"2px 8px",borderRadius:6,fontWeight:"bold",color:"#fff",background:b.color}}>{b.label}</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{flex:1,fontSize:13,fontWeight:500}}>{f.home}</span>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                {(done||live)
                  ?<div style={{background:"#0f172a",borderRadius:8,padding:"5px 14px",fontSize:17,fontWeight:"bold",
                      color:live?"#ef4444":"#22c55e"}}>{f.homeScore??0}–{f.awayScore??0}</div>
                  :<><input style={S.scoreBox} type="number" min="0" max="20" value={hv} onChange={e=>setV(f.id,"home",e.target.value)}/>
                    <span style={{color:"#f59e0b",fontWeight:"bold",fontSize:16}}>:</span>
                    <input style={S.scoreBox} type="number" min="0" max="20" value={av} onChange={e=>setV(f.id,"away",e.target.value)}/></>
                }
              </div>
              <span style={{flex:1,fontSize:13,fontWeight:500,textAlign:"right"}}>{f.away}</span>
            </div>
            {done&&pred&&(
              <div style={{marginTop:6,background:"#0f172a",borderRadius:8,padding:"6px 10px",fontSize:12}}>
                <span style={{color:"#64748b"}}>Pred: </span><b style={{color:"#f1f5f9"}}>{pred.home}–{pred.away}</b>
                <span style={{color:"#64748b",marginLeft:8}}>Error: </span><span style={{color:"#f1f5f9"}}>{r.error} gol{r.error!==1?"es":""}</span>
                <span style={{color:"#64748b",marginLeft:8}}>Base: </span><b style={{color:"#f59e0b"}}>{r.pts}</b>
                <span style={{color:"#64748b",marginLeft:6}}>+Bonus: </span><b style={{color:"#7c3aed"}}>{r.bonus}</b>
              </div>
            )}
            {!done&&!live&&<button style={S.saveBtn} onClick={()=>onSave(f.id,hv,av)}>Guardar predicción</button>}
          </div>
        );
      })}
    </div>
  );
}

// ── DREAM XI ──────────────────────────────────────────────────────────────
function DreamXITab({user,dreamXI,onSave}) {
  const [selected,setSelected]=useState(dreamXI[user]||[]);
  const [search,setSearch]=useState("");
  const [posF,setPosF]=useState("ALL");
  const [ctryF,setCtryF]=useState("ALL");
  useEffect(()=>setSelected(dreamXI[user]||[]),[user,JSON.stringify(dreamXI[user])]);
  const topCount=selected.filter(p=>TOP30.has(p.name)).length;
  const toggle=(p)=>{
    if(selected.find(s=>s.name===p.name)){setSelected(selected.filter(s=>s.name!==p.name));return;}
    if(selected.length>=11||(TOP30.has(p.name)&&topCount>=3))return;
    setSelected([...selected,p]);
  };
  const countries=["ALL",...new Set(PLAYERS.map(p=>p.country))].sort((a,b)=>a==="ALL"?-1:a.localeCompare(b));
  const filtered=PLAYERS.filter(p=>{
    const ms=search===""||p.name.toLowerCase().includes(search.toLowerCase())||p.country.toLowerCase().includes(search.toLowerCase());
    return ms&&(posF==="ALL"||p.pos===posF)&&(ctryF==="ALL"||p.country===ctryF);
  });
  const posLayout={POR:[0],DEF:[1,2,3,4],MED:[5,6,7],DEL:[8,9,10]};
  const slotLbl=["POR","LT","DFC","DFC","RT","MCD","MC","MC","EXT","DC","EXT"];
  return (
    <div>
      <div style={{background:"linear-gradient(135deg,#14532d,#166534)",borderRadius:12,padding:"12px 16px",
        marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontWeight:"bold",fontSize:15,color:"#86efac"}}>⭐ Dream XI — {selected.length}/11</div>
          <div style={{fontSize:12,color:"#4ade80",marginTop:2}}>TOP30 usados: {topCount}/3</div>
        </div>
        {selected.length===11&&<button style={{...S.btn,width:"auto",padding:"8px 14px",fontSize:13}} onClick={()=>onSave(selected)}>Guardar 🌟</button>}
      </div>
      {selected.length>0&&(
        <div style={{background:"#14532d",borderRadius:12,padding:12,marginBottom:12,border:"1px solid #166534"}}>
          <div style={{fontSize:12,color:"#86efac",textAlign:"center",marginBottom:8}}>Toca para quitar</div>
          {Object.entries(posLayout).map(([pos,idxs])=>(
            <div key={pos} style={{display:"flex",justifyContent:"center",gap:8,marginBottom:8}}>
              {idxs.map(i=>{
                const p=selected[i];
                return p?(
                  <div key={i} onClick={()=>toggle(p)} style={{background:"rgba(255,255,255,0.13)",borderRadius:8,
                    padding:"6px 8px",textAlign:"center",minWidth:58,cursor:"pointer",
                    border:TOP30.has(p.name)?"1px solid #fbbf24":"1px solid transparent"}}>
                    <div style={{fontSize:18}}>{p.flag}</div>
                    <div style={{fontSize:10,color:"#fff",fontWeight:"bold",maxWidth:56,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name.split(" ").slice(-1)[0]}</div>
                    <div style={{fontSize:9,color:"#86efac"}}>{slotLbl[i]}</div>
                    {TOP30.has(p.name)&&<div style={{fontSize:9,color:"#fbbf24"}}>★</div>}
                  </div>
                ):(
                  <div key={i} style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"6px 8px",textAlign:"center",minWidth:58,border:"1px dashed #166534"}}>
                    <div style={{fontSize:18,color:"rgba(74,222,128,0.2)"}}>?</div>
                    <div style={{fontSize:9,color:"#4ade80"}}>{slotLbl[i]}</div>
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      )}
      {topCount>=3&&<div style={{background:"#7c2d12",border:"1px solid #ea580c",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#fed7aa",marginBottom:10}}>⚠️ Límite de 3 estrellas TOP30 alcanzado.</div>}
      {selected.length>=11&&<div style={{background:"#1e3a5f",border:"1px solid #3b82f6",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#93c5fd",marginBottom:10}}>✅ XI completo. Pulsa «Guardar».</div>}
      <input style={{...S.inp,marginBottom:8,padding:"8px 12px",fontSize:13}} placeholder="🔍 Buscar jugador o país..." value={search} onChange={e=>setSearch(e.target.value)}/>
      <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
        {["ALL","POR","DEF","MED","DEL"].map(p=>(
          <button key={p} onClick={()=>setPosF(p)} style={{padding:"5px 10px",borderRadius:20,cursor:"pointer",
            border:`1px solid ${posF===p?"#f59e0b":"#334155"}`,
            background:posF===p?"rgba(245,158,11,0.13)":"#1e293b",
            color:posF===p?"#f59e0b":"#94a3b8",fontSize:12}}>
            {p==="ALL"?"Todos":POS_LABEL[p]}
          </button>
        ))}
      </div>
      <select style={{...S.inp,marginBottom:10,padding:"8px 12px",fontSize:13}} value={ctryF} onChange={e=>setCtryF(e.target.value)}>
        {countries.map(c=><option key={c} value={c}>{c==="ALL"?"🌍 Todos los países":c}</option>)}
      </select>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
        {filtered.map(p=>{
          const sel=!!selected.find(s=>s.name===p.name);
          const isStar=TOP30.has(p.name);
          const blocked=!sel&&(selected.length>=11||(isStar&&topCount>=3));
          return (
            <button key={p.name} onClick={()=>!blocked&&toggle(p)} style={{display:"flex",alignItems:"center",gap:8,
              padding:"9px 10px",textAlign:"left",
              background:sel?"#0f3460":blocked?"#111827":"#1e293b",
              border:`1px solid ${sel?"#f59e0b":isStar?"#a855f7":"#334155"}`,
              borderRadius:10,cursor:blocked?"not-allowed":"pointer",opacity:blocked?0.4:1}}>
              <span style={{fontSize:20}}>{p.flag}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,color:sel?"#fbbf24":isStar?"#d8b4fe":"#f1f5f9",
                  fontWeight:isStar?"bold":"normal",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {p.name}{isStar?" ★":""}
                </div>
                <div style={{fontSize:10,color:"#64748b"}}>{p.country}</div>
              </div>
              <span style={{fontSize:10,fontWeight:"bold",padding:"2px 5px",borderRadius:4,
                background:POS_COLOR[p.pos]+"33",color:POS_COLOR[p.pos]}}>{p.pos}</span>
              {sel&&<span style={{color:"#22c55e",fontSize:14}}>✓</span>}
            </button>
          );
        })}
      </div>
      {Object.entries(dreamXI).filter(([n])=>n!==user).length>0&&(
        <div style={{marginTop:16}}>
          <div style={{fontWeight:"bold",fontSize:14,marginBottom:8}}>Los XI de los demás 👀</div>
          {Object.entries(dreamXI).filter(([n])=>n!==user).map(([name,xi])=>(
            <div key={name} style={{background:"#1e293b",borderRadius:8,padding:"10px 12px",marginBottom:6,border:"1px solid #334155"}}>
              <div style={{fontWeight:"bold",fontSize:13,marginBottom:6}}>{name}</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                {(xi||[]).map(p=>(
                  <span key={p.name||p} style={{fontSize:11,background:"#0f172a",borderRadius:12,padding:"2px 8px",
                    color:TOP30.has(p.name||p)?"#fbbf24":"#94a3b8",
                    border:`1px solid ${TOP30.has(p.name||p)?"rgba(245,158,11,0.27)":"#334155"}`}}>
                    {p.flag||""} {p.name||p}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── RANKING ───────────────────────────────────────────────────────────────
function RankingTab({leaderboard,preds,results}) {
  const [exp,setExp]=useState(null);
  return (
    <div>
      <div style={{fontWeight:"bold",fontSize:15,marginBottom:12}}>🏆 Clasificación General</div>
      {leaderboard.length===0&&<p style={{textAlign:"center",color:"#64748b",marginTop:40}}>Aún no hay participantes</p>}
      {leaderboard.map((l,i)=>(
        <div key={l.name}>
          <div onClick={()=>setExp(exp===l.name?null:l.name)} style={{display:"flex",alignItems:"center",gap:10,
            padding:"12px 14px",background:"#1e293b",cursor:"pointer",
            borderRadius:exp===l.name?"10px 10px 0 0":10,marginBottom:exp===l.name?0:7,
            borderLeft:`4px solid ${i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#b45309":"#334155"}`}}>
            <div style={{fontSize:22,width:28}}>{"🥇🥈🥉"[i]||i+1}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:"bold",fontSize:15}}>{l.name}</div>
              <div style={{fontSize:11,color:"#64748b"}}>{l.matchPts} pts partidos · {l.dreamBonus} pts Dream XI</div>
            </div>
            <div style={{fontSize:22,fontWeight:"bold",color:"#f59e0b"}}>{l.total}<span style={{fontSize:11}}> pts</span></div>
            <span style={{color:"#475569",fontSize:12}}>{exp===l.name?"▲":"▼"}</span>
          </div>
          {exp===l.name&&(
            <div style={{background:"#0f1e33",borderRadius:"0 0 10px 10px",padding:"10px 14px",marginBottom:7,
              border:"1px solid #1e3a5f",borderTop:"none"}}>
              <div style={{fontSize:12,color:"#64748b",marginBottom:6}}>Desglose por partido</div>
              {Object.entries(results).map(([id,real])=>{
                const pred=preds[l.name]?.[id], r=calcPoints(pred,real);
                return (
                  <div key={id} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:"1px solid #1e293b",fontSize:12}}>
                    <span style={{color:"#94a3b8",flex:1}}>Partido #{id}</span>
                    <span style={{color:"#64748b"}}>{real.home}–{real.away}</span>
                    <span style={{color:"#475569",fontSize:11}}>{pred?`${pred.home}–${pred.away}`:"–"}</span>
                    <span style={{fontWeight:"bold",minWidth:38,textAlign:"right",
                      color:r.total>=10?"#22c55e":r.total>=6?"#f59e0b":r.total>0?"#94a3b8":"#475569"}}>
                      {pred?`+${r.total}`:"–"}
                    </span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ── REGLAS ────────────────────────────────────────────────────────────────
function RulesTab() {
  const S2={fontSize:13,color:"#94a3b8",lineHeight:1.65,margin:0};
  const Sec=({icon,title,color,children})=>(
    <div style={{background:"#1e293b",borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${color}33`}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${color}33`}}>
        <span style={{fontSize:22}}>{icon}</span><h3 style={{margin:0,fontSize:16,color}}>{title}</h3>
      </div>
      {children}
    </div>
  );
  return (
    <div>
      <div style={{background:"linear-gradient(135deg,#1e3a5f,#0f3460)",borderRadius:16,padding:"20px 16px",
        textAlign:"center",marginBottom:16,border:"1px solid rgba(245,158,11,0.27)"}}>
        <div style={{fontSize:40}}>📖</div>
        <h2 style={{fontSize:22,color:"#f59e0b",margin:"8px 0 4px"}}>Reglas del Juego</h2>
        <p style={{fontSize:13,color:"#94a3b8",margin:0}}>Mundial 2026 · Quiniela Familiar</p>
      </div>
      <Sec icon="🎯" title="Objetivo" color="#f59e0b">
        <p style={S2}>Acumular el mayor número de puntos prediciendo resultados y eligiendo tu Dream XI. Gana quien más puntos tenga al final del Mundial.</p>
      </Sec>
      <Sec icon="⚽" title="Predicciones de Partidos" color="#3b82f6">
        <p style={S2}>Introduce tu predicción antes del pitido inicial. <b style={{color:"#f1f5f9"}}>Una vez comenzado el partido, se bloquea automáticamente.</b></p>
        <p style={{...S2,marginTop:8,color:"#f59e0b",fontWeight:"bold"}}>Los resultados se actualizan solos al terminar cada partido.</p>
        <div style={{background:"#0f172a",borderRadius:10,overflow:"hidden",marginTop:8}}>
          {[["🎯","Resultado exacto","ej: 2-1 → 2-1","10 pts","#16a34a"],
            ["🔥","Error de 1 gol","ej: 2-1 → 2-0","6 pts","#d97706"],
            ["👍","Error de 2 goles","ej: 2-1 → 3-0","3 pts","#64748b"],
            ["🤏","Error de 3 goles","ej: 3-0 → 1-1","1 pt","#475569"],
            ["💥","Error de 4+ goles","muy lejos","0 pts","#334155"]].map(([ic,t,ex,pts,col],i)=>(
            <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderBottom:"1px solid #1e293b"}}>
              <span style={{fontSize:20,width:24}}>{ic}</span>
              <div style={{flex:1}}><div style={{fontSize:13,color:"#f1f5f9",fontWeight:500}}>{t}</div><div style={{fontSize:11,color:"#64748b",fontStyle:"italic"}}>{ex}</div></div>
              <span style={{background:col,borderRadius:6,padding:"3px 9px",fontSize:13,fontWeight:"bold",color:"#fff"}}>{pts}</span>
            </div>
          ))}
        </div>
        <div style={{background:"#1e1b4b",border:"1px solid #7c3aed",borderRadius:10,padding:"10px 12px",marginTop:8,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>✅</span>
          <div style={{flex:1}}><div style={{fontSize:13,color:"#f1f5f9",fontWeight:500}}>Bonus ganador/empate</div><div style={{fontSize:11,color:"#94a3b8",fontStyle:"italic"}}>Si aciertas quién gana o que hay empate</div></div>
          <span style={{background:"#7c3aed",borderRadius:6,padding:"3px 9px",fontSize:13,fontWeight:"bold",color:"#fff"}}>+2 pts</span>
        </div>
      </Sec>
      <Sec icon="🌟" title="Dream XI" color="#a855f7">
        <p style={S2}>Elige <b style={{color:"#f1f5f9"}}>11 jugadores</b> de cualquier selección clasificada.</p>
        <div style={{background:"#2e1065",border:"1px solid #7c3aed",borderRadius:10,padding:"10px 12px",margin:"8px 0"}}>
          <div style={{fontSize:13,color:"#d8b4fe",fontWeight:"bold",marginBottom:4}}>⚠️ Regla TOP30</div>
          <div style={{fontSize:12,color:"#c4b5fd"}}>Máximo <b>3 jugadores TOP30</b> (marcados con ★) en tu XI.</div>
        </div>
        <p style={S2}>Por cada TOP30 en tu XI → <b style={{color:"#f59e0b"}}>+1 punto por jornada jugada</b>.</p>
      </Sec>
      <Sec icon="🏆" title="Desempate y Premio" color="#f59e0b">
        <p style={S2}>En caso de empate en puntos, gana quien haya acertado más resultados exactos (10 pts).</p>
        <div style={{textAlign:"center",padding:"12px 0",fontSize:32}}>🏆⚽🎉</div>
      </Sec>
    </div>
  );
}

// ── GRUPOS ────────────────────────────────────────────────────────────────
const S={
  inp:{width:"100%",padding:"11px 14px",borderRadius:10,border:"1px solid #475569",background:"#0f172a",
    color:"#f1f5f9",fontSize:15,marginBottom:10,fontFamily:"Georgia,serif",outline:"none"},
  btn:{width:"100%",padding:"11px",borderRadius:10,background:"linear-gradient(135deg,#f59e0b,#d97706)",
    border:"none",color:"#0f172a",fontSize:15,fontWeight:"bold",cursor:"pointer",fontFamily:"Georgia,serif"},
  scoreBox:{width:46,height:38,borderRadius:8,border:"1px solid #475569",background:"#0f172a",
    color:"#f1f5f9",textAlign:"center",fontSize:18,fontWeight:"bold",fontFamily:"Georgia,serif"},
  saveBtn:{display:"block",width:"100%",marginTop:8,padding:"7px",background:"#0f3460",
    border:"1px solid #1d4ed8",borderRadius:8,color:"#93c5fd",fontSize:13,cursor:"pointer",fontFamily:"Georgia,serif"},
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
